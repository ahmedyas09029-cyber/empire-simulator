<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KORELI | CEO EDITION</title>
    <style>
        :root { --accent: #a855f7; --bg: #050505; --card: #121212; --text: #f0f0f0; --coin: #FFD700; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a1a; background: rgba(5,5,5,0.9); }
        .logo { font-weight: 900; font-size: 1.5rem; background: linear-gradient(90deg, #fff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .coin-pill { border: 1px solid var(--coin); padding: 5px 12px; border-radius: 20px; color: var(--coin); font-size: 0.8rem; font-weight: bold; }

        .content { flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .page { display: none; padding: 15px; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Studio d'Upload */
        .studio { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #222; margin-bottom: 20px; }
        textarea { width: 100%; background: none; border: none; color: white; outline: none; font-size: 1rem; resize: none; }

        /* Posts */
        .post { background: var(--card); border-radius: 20px; margin-bottom: 20px; overflow: hidden; border: 1px solid #1a1a1a; }
        .post-user-info { padding: 12px; display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 0.85rem; }
        .avatar-mini { width: 25px; height: 25px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent); }
        video { width: 100%; background: #000; }

        /* Profil */
        .profile-main { text-align: center; padding: 20px; }
        .avatar-big { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); margin: 0 auto 15px; display: block; cursor: pointer; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .stat-item { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid #222; }

        /* Nav Bar */
        .nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 65px; background: #121212; border-radius: 30px; border: 1px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { color: #555; font-size: 1.6rem; cursor: pointer; border: none; background: none; transition: 0.3s; }
        .nav-item.active { color: var(--accent); transform: scale(1.1); }
    </style>
</head>
<body onload="init()">

    <div class="header">
        <div class="logo">KORELI</div>
        <div class="coin-pill">💎 <span id="coins-count">50000</span></div>
    </div>

    <div class="content">
        <div id="p-home" class="page active">
            <div class="studio">
                <textarea id="desc-in" placeholder="Exprime ta créativité..."></textarea>
                <input type="file" id="video-in" accept="video/*" style="display:none" onchange="previewVid()">
                <button onclick="document.getElementById('video-in').click()" style="width:100%; padding:12px; background:#0a0a0a; color:var(--accent); border:1px dashed var(--accent); border-radius:12px; margin-top:10px; font-weight:bold;">🎥 CHARGER UNE VIDÉO</button>
                <button onclick="publish()" style="width:100%; padding:14px; background:var(--accent); color:white; border:none; border-radius:12px; margin-top:10px; font-weight:bold;">PUBLIER SUR KORELI</button>
            </div>
            <div id="feed"></div>
        </div>

        <div id="p-profile" class="page">
            <div class="profile-main">
                <input type="file" id="avatar-in" accept="image/*" style="display:none" onchange="updateAvatar()">
                <img src="https://via.placeholder.com/100" id="user-avatar" class="avatar-big" onclick="document.getElementById('avatar-in').click()">
                <h2 id="display-name" onclick="changeName()" style="cursor:pointer">Ahmed-Yasin ✏️</h2>
                <span style="background:var(--accent); padding:5px 12px; border-radius:20px; font-size:0.7rem; font-weight:bold; letter-spacing:1px;">CEO OFFICIAL</span>
                
                <div class="stats-grid">
                    <div class="stat-item"><div style="color:var(--coin); font-weight:bold;">💎 Coins</div><div id="coins-stat">50000</div></div>
                    <div class="stat-item"><div style="color:var(--accent); font-weight:bold;">🎬 Vidéos</div><div id="vids-stat">0</div></div>
                </div>

                <div style="margin-top:20px; font-size:0.8rem; color:#666;">Clique sur la photo ou le nom pour modifier</div>
            </div>
        </div>
    </div>

    <div class="nav">
        <button class="nav-item active" onclick="go('home', this)">🏠</button>
        <button class="nav-item" onclick="go('profile', this)">👤</button>
    </div>

    <script>
        let videoData = null;
        let vCount = 0;
        let currentName = "Ahmed-Yasin";
        let currentAvatar = "https://www.w3schools.com/howto/img_avatar.png";

        // BOT DE MODÉRATION (LEGAL & YOUTUBE STYLE)
        const BANNED = ["fuck", "hack", "merde", "pirate"];

        function previewVid() {
            const file = document.getElementById('video-in').files[0];
            const reader = new FileReader();
            reader.onload = (e) => { videoData = e.target.result; };
            reader.readAsDataURL(file);
        }

        function updateAvatar() {
            const file = document.getElementById('avatar-in').files[0];
            const reader = new FileReader();
            reader.onload = (e) => { 
                currentAvatar = e.target.result;
                document.getElementById('user-avatar').src = currentAvatar;
                localStorage.setItem('k_avatar', currentAvatar);
            };
            reader.readAsDataURL(file);
        }

        function changeName() {
            const n = prompt("Nouveau pseudo :", currentName);
            if(n) {
                currentName = n;
                document.getElementById('display-name').innerText = n + " ✏️";
                localStorage.setItem('k_name', n);
            }
        }

        function publish() {
            const desc = document.getElementById('desc-in').value;
            if(BANNED.some(w => desc.toLowerCase().includes(w))) {
                alert("🤖 BOT KORELI : Contenu bloqué (Règles de communauté).");
                return;
            }

            const feed = document.getElementById('feed');
            const post = `
                <div class="post">
                    <div class="post-user-info">
                        <img src="${currentAvatar}" class="avatar-mini">
                        ${currentName} <span style="color:var(--accent); font-size:0.6rem;">CEO</span>
                    </div>
                    ${videoData ? `<video controls src="${videoData}"></video>` : ''}
                    <div style="padding:15px; font-size:0.9rem;">${desc}</div>
                </div>`;
            feed.insertAdjacentHTML('afterbegin', post);
            vCount++;
            document.getElementById('vids-stat').innerText = vCount;
            document.getElementById('desc-in').value = "";
            videoData = null;
        }

        function go(id, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('p-' + id).classList.add('active');
            btn.classList.add('active');
        }

        function init() {
            const c = localStorage.getItem('k_coins') || '50000';
            const n = localStorage.getItem('k_name') || 'Ahmed-Yasin';
            const a = localStorage.getItem('k_avatar') || 'https://www.w3schools.com/howto/img_avatar.png';
            
            currentName = n;
            currentAvatar = a;
            
            document.getElementById('coins-count').innerText = c;
            document.getElementById('coins-stat').innerText = c;
            document.getElementById('display-name').innerText = n + " ✏️";
            document.getElementById('user-avatar').src = a;
        }
    </script>
</body>
</html>
