<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AY CORPS | LEADERBOARD</title>
    <style>
        :root { --bg: #010409; --accent: #0070f3; --green: #00dfd8; --card: #0d1117; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; text-align: center; }
        nav { padding: 15px; border-bottom: 1px solid #21262d; background: rgba(1,4,9,0.9); }
        
        /* Style du Jeu */
        .game-container { padding: 40px 20px; max-width: 400px; margin: auto; }
        .score-box { background: var(--card); border: 1px solid #30363d; padding: 25px; border-radius: 20px; margin-bottom: 20px; }
        .score-num { font-size: 2.8rem; font-weight: 800; color: var(--green); }
        
        .click-btn { 
            width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--accent);
            background: #111; color: white; font-size: 2rem; cursor: pointer; transition: 0.1s;
        }
        .click-btn:active { transform: scale(0.9); box-shadow: 0 0 20px var(--accent); }

        /* Style du Classement */
        .leaderboard { background: #080a0c; border: 1px solid #222; border-radius: 12px; margin-top: 30px; overflow: hidden; }
        .lb-header { background: #111; padding: 10px; font-size: 0.7rem; letter-spacing: 2px; color: var(--accent); font-weight: bold; }
        .lb-row { display: flex; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid #111; font-size: 0.85rem; }
        .lb-row:last-child { border: none; }
        .rank-1 { color: var(--green); font-weight: bold; }
    </style>
</head>
<body onload="init()">

    <nav><strong>AHMED-YASIN CORPS</strong></nav>

    <div class="game-container">
        <div class="score-box">
            <div class="score-num" id="pts">0</div>
            <div style="font-size:0.7rem; color:var(--accent); letter-spacing:1px">POINTS D'EMPIRE</div>
            <br>
            <button class="click-btn" onclick="hit()">⚡</button>
        </div>

        <div class="leaderboard">
            <div class="lb-header">CLASSEMENT MONDIAL (SIMULÉ)</div>
            <div id="lb-content">
                </div>
        </div>
        
        <button onclick="resetScore()" style="margin-top:20px; background:none; border:none; color:#333; font-size:0.6rem; cursor:pointer;">RÉINITIALISER MON SCORE</button>
    </div>

    <script>
        let score = 0;
        let fakePlayers = [
            {name: "Elon M.", score: 500000},
            {name: "Gojo S.", score: 250000},
            {name: "Traders_Pro", score: 100000}
        ];

        function hit() {
            score += 10;
            updateUI();
            save();
        }

        function updateUI() {
            document.getElementById('pts').innerText = score;
            
            // On ajoute toi au classement
            let allPlayers = [...fakePlayers, {name: "MOI (Ahmed-Yasin)", score: score}];
            allPlayers.sort((a, b) => b.score - a.score);

            const content = document.getElementById('lb-content');
            content.innerHTML = allPlayers.slice(0, 5).map((p, i) => `
                <div class="lb-row ${i === 0 ? 'rank-1' : ''}">
                    <span>${i + 1}. ${p.name}</span>
                    <span>${p.score.toLocaleString()}</span>
                </div>
            `).join('');
        }

        function save() { localStorage.setItem('ay_score', score); }
        function resetScore() { score = 0; save(); updateUI(); }

        function init() {
            const saved = localStorage.getItem('ay_score');
            if(saved) score = parseInt(saved);
            updateUI();
        }
    </script>
</body>
</html>
