<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KORELI | EMPIRE CLOUD</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --accent: #a855f7; --bg: #050505; --card: #121212; --text: #f0f0f0; --coin: #FFD700; --founder: linear-gradient(45deg, #FFD700, #a855f7); }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a1a; background: #050505; }
        .logo { font-weight: 900; font-size: 1.2rem; background: linear-gradient(90deg, #fff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        .card { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #222; margin-bottom: 15px; text-align: center; }
        input { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 15px; border-radius: 12px; margin: 10px 0; font-size: 1rem; box-sizing: border-box; }
        .btn-auth { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; background: white; color: black; font-size: 1rem; }
        .btn-ceo { background: var(--founder); color: black; border: none; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body onload="init()">

    <div class="header">
        <div class="logo">KORELI NETWORK</div>
        <div style="color:var(--coin); font-weight:bold;">💎 <span id="top-coins">0</span></div>
    </div>

    <div id="auth-screen" style="display:none; padding:50px 20px; text-align:center;">
        <h1 style="font-size: 3rem; margin:0;">👑</h1>
        <h2>Accès Citoyen</h2>
        <p style="color:#888; font-size:0.9rem; margin-bottom:20px;">Entrez votre email. Un lien de connexion unique sera envoyé dans votre boîte mail.</p>
        <input type="email" id="email-input" placeholder="votre@email.com">
        <button class="btn-auth" onclick="loginWithEmail()">Envoyer mon Lien Magique</button>
    </div>

    <div id="main-app" style="display:none;" class="content">
        <div class="card">
            <h2 id="user-name">...</h2>
            <div id="user-badge"></div>
            <p style="font-size: 1.3rem; margin-top:15px;">K-Coins : <span id="user-coins" style="color:var(--coin); font-weight:bold;">0</span> 💎</p>
        </div>

        <div id="ceo-panel" style="display:none;" class="card">
            <h3 style="color:var(--coin);">🏦 TRÉSORERIE DU FOUNDER</h3>
            <input type="text" id="target-user" placeholder="Pseudo du destinataire">
            <input type="number" id="gift-amount" placeholder="Montant en 💎">
            <button class="btn-ceo" onclick="giftCoins()">GÉNÉRER LES K-COINS</button>
        </div>

        <div class="card" style="border: 1px dashed #444;">
            <p style="color:#44ff44; font-size:0.8rem;">PROJET CLOUD : ebykrodcycqcpcfuqpzi ✅</p>
            <button onclick="logout()" style="background:none; border:1px solid #ff4444; color:#ff4444; padding:8px 15px; border-radius:8px; margin-top:10px; cursor:pointer;">Déconnexion</button>
        </div>
    </div>

    <script>
        // CONFIGURATION SUPABASE (PROJET ID : ebykrodcycqcpcfuqpzi)
        const PROJECT_URL = "https://ebykrodcycqcpcfuqpzi.supabase.co"; //
        const PUBLIC_KEY = "sb_publishable_j_DNfP9D_2K3uAzbb6-Giw_cWJJfR8_"; //
        const REDIRECT_URL = "https://empire-simulator-ahmedyas09029-cybers-projects.vercel.app/"; //
        
        const sb = supabase.createClient(PROJECT_URL, PUBLIC_KEY);

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) { showApp(session.user); } 
            else { document.getElementById('auth-screen').style.display = 'block'; }
        }

        async function loginWithEmail() {
            const email = document.getElementById('email-input').value;
            if(!email) return alert("Veuillez entrer une adresse email valide.");
            
            const { error } = await sb.auth.signInWithOtp({
                email: email,
                options: { emailRedirectTo: REDIRECT_URL }
            });
            
            if (error) alert("Erreur d'envoi : " + error.message);
            else alert("Lien envoyé ! Consultez votre boîte mail pour entrer dans l'empire.");
        }

        async function logout() { await sb.auth.signOut(); location.reload(); }

        function showApp(user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';

            // RECONNAISSANCE DU PROPRIÉTAIRE
            const isCEO = (user.email === "ahmedyas09029@gmail.com");

            document.getElementById('user-name').innerText = user.email;
            document.getElementById('top-coins').innerText = isCEO ? "∞" : "0";
            document.getElementById('user-coins').innerText = isCEO ? "ILLIMITÉ" : "0";

            if(isCEO) {
                document.getElementById('user-badge').innerHTML = '<span style="background:var(--founder); color:black; padding:5px 15px; border-radius:15px; font-weight:bold;">👑 GRAND FOUNDER</span>';
                document.getElementById('ceo-panel').style.display = 'block';
            }
        }

        function giftCoins() {
            const target = document.getElementById('target-user').value;
            const amt = document.getElementById('gift-amount').value;
            if(target && amt) { 
                alert(`ORDRE DU FOUNDER : ${amt} 💎 ont été transférés à ${target}.`); 
            }
        }
    </script>
</body>
</html>
