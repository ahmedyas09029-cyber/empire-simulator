<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empire OS | AHMED-YASIN</title>
    <style>
        :root { --gold: #d4af37; --green: #00ff88; --red: #ff4444; }
        body { background: #020202; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 0; }
        .header { background: #111; padding: 15px; border-bottom: 2px solid var(--gold); font-size: 0.8rem; display: flex; justify-content: space-around; }
        .rank-badge { color: var(--gold); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin: 15px 0; font-size: 1.2rem; }
        .main-card { background: linear-gradient(145deg, #0a0a0a, #151515); border: 1px solid var(--gold); border-radius: 20px; padding: 25px; margin: 20px auto; max-width: 340px; text-align: left; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(212, 175, 55, 0.1); }
        .main-card::before { content: "PREMIUM"; position: absolute; top: 10px; right: -30px; background: var(--gold); color: black; font-size: 0.6rem; padding: 5px 40px; transform: rotate(45deg); font-weight: bold; }
        .balance { font-size: 2.5rem; font-weight: bold; margin: 10px 0; color: var(--gold); }
        .trade-panel { max-width: 340px; margin: auto; background: #111; padding: 20px; border-radius: 15px; border: 1px solid #222; }
        input { background: #000; border: 1px solid #333; color: var(--green); padding: 15px; width: 85%; border-radius: 10px; margin-bottom: 15px; font-size: 1.1rem; text-align: center; outline: none; }
        .btn-buy { background: var(--green); color: black; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 48%; cursor: pointer; }
        .btn-sell { background: var(--red); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 48%; cursor: pointer; }
        .logs { max-width: 340px; margin: 20px auto; text-align: left; font-family: monospace; font-size: 0.7rem; color: #666; height: 80px; overflow-y: auto; padding: 10px; background: #080808; border-radius: 5px; }
    </style>
</head>
<body onload="init()">

    <div class="header">
        <span>BTC/USD: <span id="btc-price" style="color:var(--green)">CHARGEMENT...</span></span>
        <span>STATUS: <span id="server-status" style="color:var(--green)">VÉRIFIÉ</span></span>
    </div>

    <div class="rank-badge" id="rank-name">TRADER NOVICE</div>

    <div class="main-card">
        <div style="font-size: 0.7rem; opacity: 0.5;">CAPITAL DISPONIBLE</div>
        <div class="balance">$ <span id="balance">10,000</span></div>
        <div style="font-size: 0.8rem; border-top: 1px solid #222; padding-top: 15px;">
            <div>BTC POSSÉDÉS: <span id="btc-qty" style="color:white">0.000000</span></div>
            <div>VALEUR MARCHÉ: <span id="pos-value" style="color:var(--green)">$0.00</span></div>
        </div>
    </div>

    <div class="trade-panel">
        <input type="number" id="trade-input" placeholder="MONTANT EN $">
        <div style="display:flex; justify-content: space-between;">
            <button class="btn-buy" onclick="executeTrade('buy')">ACHETER</button>
            <button class="btn-sell" onclick="executeTrade('sell')">VENDRE</button>
        </div>
    </div>

    <div class="logs" id="history">> SYSTÈME INITIALISÉ.</div>

    <script>
        let capital = 10000;
        let btcAmount = 0;
        let btcPrice = 0;

        async function updateBTC() {
            try {
                // Changement d'API pour plus de stabilité (Binance Public API)
                const r = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
                const d = await r.json();
                btcPrice = parseFloat(d.price);
                document.getElementById('btc-price').innerText = '$' + btcPrice.toLocaleString();
                document.getElementById('btc-price').style.color = "var(--green)";
                refreshUI();
            } catch(e) { 
                console.log("API Error, retry in 5s...");
                document.getElementById('btc-price').innerText = 'RECONNEXION...';
                document.getElementById('btc-price').style.color = "orange";
            }
        }

        function executeTrade(type) {
            if(btcPrice <= 0) {
                alert("Erreur de connexion : Impossible de récupérer le prix du marché. Réessaie dans quelques secondes.");
                return;
            }
            
            let val = parseFloat(document.getElementById('trade-input').value);
            if(isNaN(val) || val <= 0) return;

            if(type === 'buy') {
                if(val <= capital) {
                    capital -= val;
                    btcAmount += val / btcPrice;
                    log(`ACHAT BTC: -$${val}`);
                } else { alert("Fonds insuffisants"); }
            } else {
                if(btcAmount > 0) {
                    let gain = btcAmount * btcPrice;
                    capital += gain;
                    log(`VENTE BTC: +$${gain.toFixed(2)}`);
                    btcAmount = 0;
                } else { alert("Aucun BTC à vendre"); }
            }
            save();
            refreshUI();
            document.getElementById('trade-input').value = "";
        }

        function refreshUI() {
            document.getElementById('balance').innerText = Math.floor(capital).toLocaleString();
            document.getElementById('btc-qty').innerText = btcAmount.toFixed(6);
            document.getElementById('pos-value').innerText = '$' + (btcAmount * btcPrice).toFixed(2);
            
            let rank = "TRADER NOVICE";
            if(capital > 20000) rank = "SHARK FINANCIER";
            if(capital > 100000) rank = "EMPIRE CEO";
            if(capital > 1000000) rank = "LEGENDARY GOJO";
            document.getElementById('rank-name').innerText = rank;
        }

        function log(m) {
            const h = document.getElementById('history');
            h.innerHTML = `<div>> ${new Date().toLocaleTimeString()} | ${m}</div>` + h.innerHTML;
        }

        function save() {
            localStorage.setItem('emp_cap', capital);
            localStorage.setItem('emp_btc', btcAmount);
        }

        function init() {
            const c = localStorage.getItem('emp_cap');
            const b = localStorage.getItem('emp_btc');
            if(c) capital = parseFloat(c);
            if(b) btcAmount = parseFloat(b);
            updateBTC();
            setInterval(updateBTC, 5000); // Mise à jour toutes les 5 secondes
        }
    </script>
</body>
</html>
