<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KORELI | VERSION ALPHA</title>
    <style>
        :root { --accent: #a855f7; --bg: #000000; --card: #111111; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header Fixe */
        .app-header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: #000; }
        .app-logo { font-weight: 900; font-size: 1.2rem; letter-spacing: -1px; background: linear-gradient(45deg, #a855f7, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Conteneur de Pages */
        .content-area { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .page { display: none; padding: 20px; }
        .page.active { display: block; }

        /* Style Profil */
        .profile-header { text-align: center; margin-bottom: 30px; }
        .avatar { width: 100px; height: 100px; background: #1a1a1a; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; border: 2px solid var(--accent); }
        input { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-sizing: border-box; }

        /* Style Chat (Koreli Engine) */
        .chat-container { display: flex; flex-direction: column; height: 70vh; }
        .msg-list { flex: 1; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 0.8rem; }
        .msg { margin-bottom: 10px; padding: 10px; border-radius: 10px; max-width: 85%; }
        .msg.partner { background: #1a1a1a; color: #3b82f6; border-left: 3px solid #3b82f6; }
        .msg.user { background: #1a1a1a; color: #10b981; border-left: 3px solid #10b981; margin-left: auto; }

        /* Navigation Basse */
        .nav-bar { position: fixed; bottom: 0; width: 100%; height: 70px; background: #080808; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { color: #555; font-size: 0.7rem; text-align: center; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 1.5rem; display: block; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="app-logo">KORELI ENGINE</div>
        <div style="font-size: 0.6rem; color: #10b981;">PARTNER: ACTIVE</div>
    </div>

    <div class="content-area">
        <div id="page-chat" class="page active">
            <div class="chat-container">
                <div class="msg-list" id="chat-list">
                    <div class="msg partner"><strong>[GEMINI]:</strong> J'ai restructuré tout le code pour ton téléphone. Dis-moi si c'est plus propre maintenant.</div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="chat-in" placeholder="Message..." style="margin-bottom: 0;">
                    <button onclick="sendMsg()" style="background:var(--accent); border:none; border-radius:12px; color:white; padding:0 20px; font-weight:bold;">></button>
                </div>
            </div>
        </div>

        <div id="page-profile" class="page">
            <div class="profile-header">
                <div class="avatar" id="avatar">👤</div>
                <h3>Paramètres Profil</h3>
            </div>
            <input type="text" id="p-name" placeholder="Nom d'utilisateur" onkeyup="save()">
            <input type="text" id="p-bio" placeholder="Bio" onkeyup="save()">
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('chat', this)">
            <span class="nav-icon">💬</span> CHAT
        </div>
        <div class="nav-item" onclick="switchPage('profile', this)">
            <span class="nav-icon">👤</span> PROFIL
        </div>
    </div>

    <script>
        function switchPage(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            el.classList.add('active');
        }

        function sendMsg() {
            const input = document.getElementById('chat-in');
            if(!input.value) return;
            const list = document.getElementById('chat-list');
            list.innerHTML += `<div class="msg user"><strong>[MOI]:</strong> ${input.value}</div>`;
            input.value = "";
            list.scrollTop = list.scrollHeight;
        }

        function save() {
            localStorage.setItem('k_name', document.getElementById('p-name').value);
        }

        function init() {
            if(localStorage.getItem('k_name')) document.getElementById('p-name').value = localStorage.getItem('k_name');
        }
        init();
    </script>
</body>
</html>
