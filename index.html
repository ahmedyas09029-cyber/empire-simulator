<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koreli Network</title>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      color: white;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      margin: 16px;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 30px rgba(255,215,0,0.1);
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg,#7f00ff,#ffd700);
      color: black;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🌌 KORELI</h1>
    <p>Réseau privé intelligent</p>
    <button onclick="login()">Connexion</button>
  </div>

  <div class="card" id="dash" style="display:none">
    <h2>👑 Dashboard</h2>
    <p id="email"></p>
    <p>💎 Coins: <span id="coins">0</span></p>
  </div>

  <script>
    const supabase = supabase.createClient(
      "https://ebykrodcycqcpcfuqpzi.supabase.co",
      "sb_publishable_j_DNfP9D_2K3uAzbb6-Giw_cWJJfR8"
    );

    async function login() {
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: "google"
      });
      if (error) alert(error.message);
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        document.querySelector("button").style.display = "none";
        document.getElementById("dash").style.display = "block";
        document.getElementById("email").innerText = session.user.email;
        document.getElementById("coins").innerText = 100;
      }
    });
  </script>

</body>
</html>
