<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHMED-YASIN | SYSTEMS</title>
    <style>
        :root { 
            --bg: #010409; 
            --accent-blue: #0070f3; 
            --accent-green: #00dfd8; 
            --text-main: #ffffff;
            --text-dim: #8899a6;
        }
        
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            background-image: radial-gradient(circle at 50% -20%, #002d5a 0%, #010409 60%);
        }
        
        .container { text-align: center; padding: 20px; }

        .status-pill {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 112, 243, 0.1);
            border: 1px solid rgba(0, 112, 243, 0.3);
            color: var(--accent-blue);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px var(--accent-green);
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        p {
            color: var(--text-dim);
            font-size: 1.1rem;
            max-width: 400px;
            line-height: 1.6;
            margin: 20px auto;
        }

        .action-area {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-main {
            background: var(--text-main);
            color: var(--bg);
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid #333;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-outline:hover {
            border-color: var(--accent-blue);
            background: rgba(0, 112, 243, 0.05);
        }

        .footer {
            position: absolute;
            bottom: 40px;
            font-size: 0.7rem;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-pill">
            <div class="status-dot"></div>
            SYSTÈME OPÉRATIONNEL
        </div>
        
        <h1>AHMED-YASIN CORPS</h1>
        
        <p>Architectures numériques et gestion d'actifs de nouvelle génération. <br>Le futur se construit ici.</p>

        <div class="action-area">
            <button class="btn-main" onclick="alert('Initialisation du protocole...')">DÉPLOYER</button>
            <button class="btn-outline" onclick="location.reload()">ACTUALISER</button>
        </div>
    </div>

    <div class="footer">
        INFRASTRUCTURE SÉCURISÉE | © 2026
    </div>

</body>
</html>
