<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KORELI | OFFICIAL EMPIRE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --accent: #a855f7; --bg: #050505; --card: #121212; --text: #f0f0f0; --coin: #FFD700; --euro: #00ff88; --founder: linear-gradient(135deg, #FFD700, #ff8800); }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; background: rgba(5,5,5,0.8); backdrop-filter: blur(10px); }
        .logo { font-weight: 900; font-size: 1.4rem; background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        .card { background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid #222; margin-bottom: 20px; text-align: center; }
        input { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 15px; border-radius: 16px; margin: 8px 0; box-sizing: border-box; font-size: 1rem; }
        input:focus { border-color: var(--accent); outline: none; }
        .btn-main { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: 800; cursor: pointer; font-size: 1rem; transition: 0.3s; margin-top: 10px; }
        .btn-auth { background: white; color: black; }
        .btn-signup { background: transparent; color: var(--accent); border: 1px solid var(--accent); margin-top: 15px; }
        .btn-gift { background: var(--founder); color: black; }
        .nav { position: fixed; bottom: 0; width: 100%; background: #0a0a0a; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
    </style>
</head>
<body onload="init()">

    <div class="header">
        <div class="logo">KORELI NETWORK</div>
        <div id="euro-total" style="color:var(--euro); font-weight:bold;">0.00 €</div>
    </div>

    <div id="auth-screen" style="display:none; padding:50px 30px; text-align:center;">
        <div style="font-size: 4rem;">🔑</div>
        <h1>Accès Impérial</h1>
        <p style="color:#666; margin-bottom:20px;">Saisissez vos identifiants pour entrer.</p>
        
        <input type="email" id="email-input" placeholder="Email (obligatoire)">
        <input type="password" id="password-input" placeholder="Mot de passe (obligatoire)">
        
        <button class="btn-main btn-auth" onclick="handleAuth('login')">SE CONNECTER</button>
        <button class="btn-main btn-signup" onclick="handleAuth('signup')">CRÉER UN COMPTE</button>
    </div>

    <div id="main-app" style="display:none;" class="content">
        <div class="card">
            <div id="user-badge"></div>
            <div id="user-email" style="font-size:0.8rem; color:#888; margin:10px 0;"></div>
            <div style="font-size:2.8rem; font-weight:900; color:var(--coin);" id="user-coins">0</div>
            <div style="color:var(--euro); font-weight:bold;" id="user-euros">0.00 €</div>
        </div>

        <div id="ceo-panel" style="display:none;" class="card">
            <h3 style="color:var(--coin); margin-top:0;">🏦 TRÉSORERIE DU FOUNDER</h3>
            <input type="text" id="target" placeholder="Pseudo du citoyen">
            <input type="number" id="amt" placeholder="Montant en 💎">
            <button class="btn-main btn-gift" onclick="processGift()">GÉNÉRER LES K-COINS</button>
        </div>

        <button onclick="logout()" style="background:none; border:none; color:#ff4444; font-weight:bold; cursor:pointer; width:100%; margin-top:10px;">🚪 Déconnexion</button>
    </div>

    <script>
        // CONFIGURATION SUPABASE
        const PROJECT_URL = "https://ebykrodcycqcpcfuqpzi.supabase.co"; 
        const PUBLIC_KEY = "sb_publishable_j_DNfP9D_2K3uAzbb6-Giw_cWJJfR8_";
        const sb = supabase.createClient(PROJECT_URL, PUBLIC_KEY);

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) { showApp(session.user); } 
            else { document.getElementById('auth-screen').style.display = 'block'; }
        }

        async function handleAuth(type) {
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value.trim();

            // 🛡️ VERROU ANTI-ERREUR
            if (email === "" || password === "") {
                return alert("❌ ERREUR : Tu dois remplir l'email ET le mot de passe !");
            }
            if (password.length < 6) {
                return alert("❌ SÉCURITÉ : Mot de passe trop court (minimum 6 caractères).");
            }

            let result;
            if (type === 'signup') {
                result = await sb.auth.signUp({ email, password });
                if (!result.error) alert("✅ Compte créé avec succès ! Clique maintenant sur SE CONNECTER.");
            } else {
                result = await sb.auth.signInWithPassword({ email, password });
            }

            if (result.error) alert("❌ Erreur : " + result.error.message);
            else if (result.data.session) showApp(result.data.session.user);
        }

        function showApp(user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';

            // RECONNAISSANCE DU GRAND FOUNDER
            const isCEO = (user.email === "ahmedyas09029@gmail.com");
            document.getElementById('user-email').innerText = user.email;
            
            document.getElementById('user-coins').innerText = isCEO ? "∞" : "0";
            document.getElementById('user-euros').innerText = isCEO ? "VALEUR : INFINIE" : "0.00 €";
            document.getElementById('euro-total').innerText = isCEO ? "👑 CEO" : "0.00 €";

            if(isCEO) {
                document.getElementById('user-badge').innerHTML = '<div style="background:var(--founder); color:black; padding:8px 20px; border-radius:50px; display:inline-block; font-weight:900; font-size:0.75rem; margin-bottom:10px;">👑 GRAND FOUNDER</div>';
                document.getElementById('ceo-panel').style.display = 'block';
            }
        }

        function processGift() {
            const target = document.getElementById('target').value;
            const amount = document.getElementById('amt').value;
            if(target && amount) alert(`💎 ORDRE VALIDÉ : ${amount} K-Coins envoyés à ${target}.`);
        }

        async function logout() { await sb.auth.signOut(); location.reload(); }
    </script>
</body>
</html>
