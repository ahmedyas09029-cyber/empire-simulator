<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>KORELI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
background:black;
color:white;
font-family:system-ui;
overflow:hidden;
}

.view{
display:none;
position:absolute;
width:100%;
height:100%;
overflow:auto;
}

.active{
display:block;
}

#feed{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}

.unit{
height:100vh;
scroll-snap-align:start;
position:relative;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
bottom:120px;
left:10px;
}

.actions{
position:absolute;
right:10px;
bottom:150px;
}

.nav{
position:fixed;
bottom:0;
width:100%;
height:70px;
background:black;
display:flex;
justify-content:space-around;
align-items:center;
}

.box{
background:#111;
margin:10px;
padding:15px;
border-radius:10px;
}

.btn{
padding:15px;
background:#00f2ea;
border:none;
width:100%;
margin-top:10px;
}

input,textarea{
width:100%;
padding:15px;
background:black;
color:#00f2ea;
border:1px solid #333;
margin-bottom:10px;
}

.avatar{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
}

.msg{
background:#111;
padding:10px;
margin:5px;
border-radius:10px;
}

</style>

</head>

<body>


<div id="auth">

<div class="box">

<h2>KORELI GLOBAL</h2>

<input id="email" placeholder="email">

<input id="pass" type="password">

<button class="btn" onclick="login()">
LOGIN
</button>

<button class="btn" onclick="signup()">
SIGNUP
</button>

</div>

</div>



<div id="home" class="view active">

<div id="feed"></div>

</div>



<div id="upload" class="view">

<div class="box">

<h3>Upload vidéo</h3>

<input type="file" id="file">

<textarea id="desc"
placeholder="Description"></textarea>

<button class="btn"
onclick="uploadVideo()">

UPLOAD

</button>

</div>

</div>



<div id="profile" class="view">

<div class="box">

<img id="avatar"
class="avatar">

<input type="file"
id="avatarFile">

<button class="btn"
onclick="uploadAvatar()">

Photo profil

</button>

<h3 id="username"></h3>

<button class="btn"
onclick="logout()">

Logout

</button>

</div>

</div>



<div id="search" class="view">

<div class="box">

<input id="searchInput"
placeholder="Rechercher">

<button class="btn"
onclick="searchUser()">

Search

</button>

<div id="results"></div>

</div>

</div>



<div id="chat" class="view">

<div class="box">

<div id="messages"></div>

<input id="msgText">

<button class="btn"
onclick="sendMsg()">

Send

</button>

</div>

</div>



<div class="nav">

<div onclick="go('home')">
🏠
</div>

<div onclick="go('search')">
🔎
</div>

<div onclick="go('upload')">
➕
</div>

<div onclick="go('chat')">
💬
</div>

<div onclick="go('profile')">
👤
</div>

</div>



<script>


const URL="https://ebykrodcycqcpcfuqpzi.supabase.co";

const KEY="TA_CLE_SUPABASE";

const db=supabase.createClient(URL,KEY);

let user;
let chatUser;



db.auth.onAuthStateChange((e,s)=>{

user=s?.user;

if(user){

auth.style.display="none";

loadFeed();

loadProfile();

}

});



async function login(){

await db.auth.signInWithPassword({

email:email.value,

password:pass.value

});

}



async function signup(){

await db.auth.signUp({

email:email.value,

password:pass.value

});

}



function go(v){

document.querySelectorAll(".view")

.forEach(x=>x.classList.remove("active"));

document.getElementById(v)

.classList.add("active");

}



async function loadFeed(){

let {data}=await db.from("posts")

.select("*")

.order("created_at",{ascending:false})

.limit(50);


feed.innerHTML=data.map(p=>`

<div class="unit">

<video autoplay muted loop

src="${p.image_url}">

</video>

<div class="overlay">

${p.content}

</div>

<div class="actions">

<div onclick="like('${p.id}')">

❤️ ${p.likes||0}

</div>

<div onclick="openChat('${p.user_id}')">

💬

</div>

</div>

</div>

`).join("");

}



async function like(id){

await db.rpc('increment_likes',{row_id:id});

}



async function uploadVideo(){

let f=file.files[0];

let name=Date.now()+".mp4";


await db.storage

.from("videos")

.upload(name,f);


let url=URL+

"/storage/v1/object/public/videos/"+name;


await db.from("posts")

.insert({

user_id:user.id,

image_url:url,

content:desc.value,

likes:0

});


loadFeed();

go("home");

}



async function uploadAvatar(){

let f=avatarFile.files[0];

let name=user.id+".png";


await db.storage

.from("avatars")

.upload(name,f,{upsert:true});


avatar.src=URL+

"/storage/v1/object/public/avatars/"+name;

}



async function loadProfile(){

username.innerText=user.email;

avatar.src=URL+

"/storage/v1/object/public/avatars/"+user.id+".png";

}



async function searchUser(){

let {data}=await db.from("profiles")

.select("*");


results.innerHTML=data

.filter(u=>u.email.includes(searchInput.value))

.map(u=>

`<div class="box">

${u.email}

<button onclick="openChat('${u.id}')">

Chat

</button>

</div>`

).join("");

}



function openChat(id){

chatUser=id;

go("chat");

loadMsg();

}



async function loadMsg(){

let {data}=await db.from("messages")

.select("*")

.eq("to",chatUser);


messages.innerHTML=data.map(m=>

`<div class="msg">

${m.text}

</div>`

).join("");

}



async function sendMsg(){

await db.from("messages")

.insert({

from:user.id,

to:chatUser,

text:msgText.value

});

loadMsg();

}



async function logout(){

await db.auth.signOut();

location.reload();

}


</script>

</body>

</html>
