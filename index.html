<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KORELI | EMPIRE EDITION</title>
    <style>
        :root { --accent: #a855f7; --bg: #050505; --card: #121212; --text: #f0f0f0; --coin: #FFD700; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a1a; background: rgba(5,5,5,0.9); backdrop-filter: blur(10px); z-index: 100; }
        .logo { font-weight: 900; font-size: 1.5rem; background: linear-gradient(90deg, #fff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .coin-pill { border: 1px solid var(--coin); padding: 5px 12px; border-radius: 20px; color: var(--coin); font-size: 0.8rem; font-weight: bold; box-shadow: 0 0 10px rgba(255,215,0,0.1); }

        .content { flex: 1; overflow-y: auto; padding-bottom: 100px; scroll-behavior: smooth; }
        .page { display: none; padding: 15px; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Publication */
        .studio { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #222; margin-bottom: 20px; }
        textarea { width: 100%; background: none; border: none; color: white; outline: none; font-size: 1rem; resize: none; min-height: 60px; }
        .btn-action { width: 100%; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; transition: 0.2s; }

        /* Posts */
        .post { background: var(--card); border-radius: 20px; margin-bottom: 20px; overflow: hidden; border: 1px solid #1a1a1a; }
        .post-header { padding: 12px; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .avatar-mini { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent); }
        video { width: 100%; background: #000; max-height: 70vh; }

        /* Profil */
        .profile-hero { text-align: center; padding: 30px 10px; }
        .avatar-main { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); margin: 0 auto 15px; display: block; cursor: pointer; box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
        .ceo-badge { background: var(--accent); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }

        /* Navigation */
        .nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 65px; background: rgba(18,18,18,0.95); backdrop-filter: blur(15px); border-radius: 30px; border: 1px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { color: #555; font-size: 1.6rem; cursor: pointer; border: none; background: none; transition: 0.3s; padding: 10px; }
        .nav-item.active { color: var(--accent); transform: translateY(-5px); }
    </style>
</head>
<body onload="init()">

    <div class="header">
        <div class="logo">KORELI</div>
        <div class="coin-pill">💎 <span id="top-coins">50000</span></div>
    </div>

    <div class="content">
        <div id="p-home" class="page active">
            <div class="studio">
                <textarea id="post-text" placeholder="Quoi de neuf, CEO ?"></textarea>
                <input type="file" id="vid-file" accept="video/*" style="display:none" onchange="handleVid()">
                <button onclick="document.getElementById('vid-file').click()" style="background:#0a0a0a; color:var(--accent); border:1px dashed var(--accent);" class="btn-action">🎥 AJOUTER UNE VIDÉO</button>
                <button onclick="publish()" style="background:var(--accent); color:white;" class="btn-action">PUBLIER SUR LE FLUX</button>
            </div>
            <div id="feed"></div>
        </div>

        <div id="p-profile" class="page">
            <div class="profile-hero">
                <input type="file" id="avatar-file" accept="image/*" style="display:none" onchange="changeAvatar()">
                <img src="https://www.w3schools.com/howto/img_avatar.png" id="prof-img" class="avatar-main" onclick="document.getElementById('avatar-file').click()">
                <h2 id="prof-name" onclick="rename()" style="margin: 10px 0; cursor:pointer;">Ahmed-Yasin ✏️</h2>
                <div class="ceo-badge">CEO & Founder</div>
                
                <div style="display:flex; gap:10px; margin-top:25px; justify-content:center;">
                    <div style="background:var(--card); padding:15px; border-radius:15px; border:1px solid #222; flex:1;">
                        <div style="color:var(--coin); font-size:1.2rem; font-weight:bold;">💎 <span id="stat-coins">50000</span></div>
                        <div style="font-size:0.7rem; color:#666;">K-COINS</div>
                    </div>
                    <div style="background:var(--card); padding:15px; border-radius:15px; border:1px solid #222; flex:1;">
                        <div style="color:var(--accent); font-size:1.2rem; font-weight:bold;" id="stat-vids">0</div>
                        <div style="font-size:0.7rem; color:#666;">VIDÉOS</div>
                    </div>
                </div>

                <button onclick="shareProfile()" style="background:#1a1a1a; color:white; border:1px solid #333; margin-top:20px;" class="btn-action">🔗 PARTAGER MON PROFIL</button>
            </div>
        </div>
    </div>

    <div class="nav">
        <button class="nav-item active" onclick="go('home', this)">🏠</button>
        <button class="nav-item" onclick="go('profile', this)">👤</button>
    </div>

    <script>
        let currentVideo = null;
        let videoCount = 0;
        let userData = {
            name: "Ahmed-Yasin",
            avatar: "https://www.w3schools.com/howto/img_avatar.png",
            coins: 50000
        };

        const BANNED = ["fuck", "merde", "hack", "pirate", "money"]; // Bot Sentinel

        function handleVid() {
            const file = document.getElementById('vid-file').files[0];
            const reader = new FileReader();
            reader.onload = (e) => { currentVideo = e.target.result; };
            reader.readAsDataURL(file);
        }

        function changeAvatar() {
            const file = document.getElementById('avatar-file').files[0];
            const reader = new FileReader();
            reader.onload = (e) => { 
                userData.avatar = e.target.result;
                document.getElementById('prof-img').src = userData.avatar;
                localStorage.setItem('k_avatar', userData.avatar);
            };
            reader.readAsDataURL(file);
        }

        function rename() {
            const n = prompt("Modifier ton pseudo CEO :", userData.name);
            if(n) {
                userData.name = n;
                document.getElementById('prof-name').innerText = n + " ✏️";
                localStorage.setItem('k_name', n);
            }
        }

        function publish() {
            const text = document.getElementById('post-text').value;
            // Bot de modération
            if(BANNED.some(w => text.toLowerCase().includes(w))) {
                alert("🤖 BOT SENTINEL : Message bloqué pour non-respect des règles.");
                return;
            }

            if(!currentVideo && !text) return;

            const post = `
                <div class="post">
                    <div class="post-header">
                        <img src="${userData.avatar}" class="avatar-mini">
                        ${userData.name} <span style="color:var(--accent); font-size:0.6rem;">CEO</span>
                    </div>
                    ${currentVideo ? `<video controls src="${currentVideo}"></video>` : ''}
                    <div style="padding:15px; font-size:0.95rem; line-height:1.4;">${text}</div>
                </div>`;
            
            document.getElementById('feed').insertAdjacentHTML('afterbegin', post);
            videoCount++;
            document.getElementById('stat-vids').innerText = videoCount;
            document.getElementById('post-text').value = "";
            currentVideo = null;
        }

        function shareProfile() {
            const url = window.location.href;
            navigator.clipboard.writeText(url);
            alert("Lien du profil Koreli copié ! Prêt à être envoyé.");
        }

        function go(id, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('p-' + id).classList.add('active');
            btn.classList.add('active');
        }

        function init() {
            userData.name = localStorage.getItem('k_name') || "Ahmed-Yasin";
            userData.avatar = localStorage.getItem('k_avatar') || "https://www.w3schools.com/howto/img_avatar.png";
            userData.coins = localStorage.getItem('k_coins') || "50000";

            document.getElementById('top-coins').innerText = userData.coins;
            document.getElementById('stat-coins').innerText = userData.coins;
            document.getElementById('prof-name').innerText = userData.name + " ✏️";
            document.getElementById('prof-img').src = userData.avatar;
        }
    </script>
</body>
</html>
