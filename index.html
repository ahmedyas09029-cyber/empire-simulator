<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KORELI OS | OVERDRIVE</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --accent: #00f2ea; --snap: #FFFC00; --bg: #000; --surface: rgba(20, 20, 20, 0.8); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: #000; color: white; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; height: 100vh; overflow: hidden; }

        /* LOADER OVERLAY */
        #loader { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
        .scanner { width: 40px; height: 40px; border: 3px solid #111; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* VUES */
        .view { position: absolute; inset: 0; opacity: 0; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; pointer-events: none; visibility: hidden; transform: scale(1.05); }
        .view.active { opacity: 1; pointer-events: auto; visibility: visible; transform: scale(1); z-index: 10; }

        /* YOUTUBE SHORTS FEED */
        #feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; background: #000; }
        #feed::-webkit-scrollbar { display: none; }
        .unit { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* HUD SNAPCHAT STYLE */
        .v-hud { position: absolute; bottom: 100px; left: 15px; right: 70px; z-index: 100; pointer-events: none; }
        .v-author { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .v-author::before { content: ''; width: 32px; height: 32px; background: linear-gradient(45deg, var(--accent), #fff); border-radius: 50%; display: block; }
        .v-desc { font-size: 14px; opacity: 0.9; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .side-actions { position: absolute; right: 10px; bottom: 120px; display: flex; flex-direction: column; gap: 22px; z-index: 101; align-items: center; }
        .action-btn { background: none; border: none; color: white; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .action-btn i { font-size: 28px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .action-btn span { font-size: 11px; font-weight: 700; }

        /* PROFIL COMPONENT */
        .profile-container { padding: 80px 20px; height: 100%; overflow-y: auto; background: linear-gradient(to bottom, #111, #000); }
        .user-header { background: var(--surface); padding: 30px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.05); text-align: center; backdrop-filter: blur(10px); }
        .avatar-box { width: 80px; height: 80px; background: var(--accent); border-radius: 30px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 35px; color: #000; box-shadow: 0 10px 20px rgba(0,242,234,0.3); }
        
        /* NAV BAR FLOAT */
        .nav-os { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 65px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); border-radius: 30px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; border: 1px solid rgba(255,255,255,0.1); }
        .nav-os div { color: #555; font-size: 20px; transition: 0.3s; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .nav-os .active { color: var(--accent); background: rgba(0,242,234,0.1); }

        .quest-list { margin-top: 30px; display: grid; gap: 12px; }
        .quest-item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div id="loader"><div class="scanner"></div></div>

    <div id="v-feed" class="view active">
        <div id="feed"></div>
    </div>

    <div id="v-profile" class="view">
        <div class="profile-container">
            <div class="user-header">
                <div class="avatar-box"><i class="fa-solid fa-bolt"></i></div>
                <h2 id="prof-user">AGENT_KORELI</h2>
                <div style="background: var(--accent); color:#000; font-size:10px; font-weight:900; padding:4px 12px; border-radius:20px; display:inline-block; margin-top:8px;" id="prof-rank">RECRUE</div>
                
                <div style="display:flex; justify-content:center; gap:20px; margin-top:25px;">
                    <div><div style="font-weight:900; font-size:18px;" id="prof-xp">0</div><div style="font-size:10px; color:#666;">XP</div></div>
                    <div style="width:1px; background:#222;"></div>
                    <div><div style="font-weight:900; font-size:18px;">#1</div><div style="font-size:10px; color:#666;">RANG</div></div>
                </div>
            </div>

            <button onclick="takeSnapshot()" style="width:100%; margin-top:20px; padding:18px; background:white; color:black; border:none; border-radius:20px; font-weight:900; font-size:14px;">
                <i class="fa-solid fa-qrcode"></i> GÉNÉRER MA CARTE
            </button>

            <h4 style="margin:30px 0 15px; font-size:12px; letter-spacing:1px; color:#555;">MISSIONS QUOTIDIENNES</h4>
            <div class="quest-list" id="quest-list"></div>
        </div>
    </div>

    <nav class="nav-os">
        <div class="active" onclick="switchTab('v-feed', this)"><i class="fa-solid fa-play"></i></div>
        <div onclick="switchTab('v-profile', this)"><i class="fa-solid fa-user"></i></div>
    </nav>

    <script>
        const _URL = "https://ebykrodcycqcpcfuqpzi.supabase.co";
        const _KEY = "sb_publishable_j_DNfP9D_2K3uAzbb6-Giw_cWJJfR8_";
        const sup = supabase.createClient(_URL, _KEY);

        // --- MOCK DATA (Si Supabase est vide, on affiche ça) ---
        const dummyPosts = [
            { id: 1, content: "Bienvenue sur Koreli OS. Le futur de Djibouti est ici.", image_url: "https://v.ftcdn.net/06/15/34/09/700_F_615340913_A8TfM8N5N6V5vR5vX5vX5vX5vX5vX.mp4", likes: 12 },
            { id: 2, content: "Débloquez des récompenses exclusives chaque jour.", image_url: "https://v.ftcdn.net/05/52/65/31/700_F_552653198_vP9T5Y5Y5Y5Y5Y5Y5Y5Y5Y5Y5Y5Y.mp4", likes: 45 }
        ];

        async function boot() {
            try {
                let { data: posts } = await sup.from('posts').select('*').order('created_at', {ascending: false});
                if (!posts || posts.length === 0) posts = dummyPosts;

                document.getElementById('feed').innerHTML = posts.map(p => `
                    <div class="unit">
                        <video loop playsinline muted src="${p.image_url}" onclick="toggleMute(this)"></video>
                        <div class="v-hud">
                            <div class="v-author">@koreli_system <i class="fa-solid fa-circle-check" style="color:var(--accent); font-size:12px;"></i></div>
                            <div class="v-desc">${p.content}</div>
                        </div>
                        <div class="side-actions">
                            <div class="action-btn"><i class="fa-solid fa-heart"></i><span>${p.likes || 0}</span></div>
                            <div class="action-btn"><i class="fa-solid fa-comment"></i><span>8</span></div>
                            <div class="action-btn"><i class="fa-solid fa-share"></i><span>Partager</span></div>
                        </div>
                    </div>
                `).join('');
                setupObserver();
            } catch (e) { console.error(e); }
            finally { setTimeout(() => document.getElementById('loader').style.display = 'none', 1000); }
        }

        function toggleMute(v) {
            v.muted = !v.muted;
            if(!v.muted) v.play();
        }

        function setupObserver() {
            const obs = new IntersectionObserver(es => {
                es.forEach(e => {
                    const v = e.target.querySelector('video');
                    if(v) {
                        if(e.isIntersecting) { v.play().catch(()=>{}); }
                        else { v.pause(); v.currentTime = 0; }
                    }
                });
            }, { threshold: 0.8 });
            document.querySelectorAll('.unit').forEach(u => obs.observe(u));
        }

        async function refreshProfile() {
            const { data: { user } } = await sup.auth.getUser();
            const name = user ? user.email.split('@')[0] : "AGENT_GUEST";
            
            let xp = 0;
            if(user) {
                const { data: prof } = await sup.from('profiles').select('total_xp').eq('id', user.id).single();
                if(prof) xp = prof.total_xp;
            }

            document.getElementById('prof-user').innerText = name.toUpperCase();
            document.getElementById('prof-xp').innerText = xp;
            document.getElementById('prof-rank').innerText = xp >= 100 ? "ÉLITE" : "RECRUE";

            // Quêtes
            const { data: qs } = await sup.from('quests').select('*');
            if(qs) {
                document.getElementById('quest-list').innerHTML = qs.map(q => `
                    <div class="quest-item">
                        <div><div style="font-weight:bold; font-size:14px;">${q.title}</div><div style="font-size:10px; color:#555;">MISSION QUOTIDIENNE</div></div>
                        <div style="color:var(--accent); font-weight:900;">+${q.xp_reward} XP</div>
                    </div>
                `).join('');
            }
        }

        function switchTab(id, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-os div').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            if(id === 'v-profile') refreshProfile();
        }

        boot();
    </script>
</body>
</html>
