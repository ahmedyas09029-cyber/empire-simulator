<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KORELI OS | V3.0 SOLARIS</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --accent: #00f2ea; --bg: #000; --surface: #0d0d0d; --p: #FFD700; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: #000; color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }

        /* LOADER ULTRA-RAPIDE */
        #loader { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: var(--accent); font-size: 10px; letter-spacing: 3px;
            transition: 0.5s;
        }

        .view { position: absolute; inset: 0; opacity: 0; transition: 0.4s; pointer-events: none; visibility: hidden; }
        .view.active { opacity: 1; pointer-events: auto; visibility: visible; z-index: 10; }

        /* FEED ENGINE */
        #feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .unit { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; background: #050505; }
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }

        /* HUD & INTERFACE */
        .v-hud { position: absolute; bottom: 100px; left: 20px; right: 80px; z-index: 100; pointer-events: none; }
        .rank-tag { background: var(--accent); color: #000; font-size: 10px; font-weight: 900; padding: 5px 12px; border-radius: 4px; text-transform: uppercase; display: inline-block; box-shadow: 0 0 10px var(--accent); }
        
        /* CARD SNAPSHOT */
        #capture-zone { position: absolute; left: -9999px; }
        .agent-card { width: 320px; padding: 30px; background: #000; border: 2px solid var(--accent); border-radius: 20px; text-align: center; }

        /* NAV */
        .nav-os { position: fixed; bottom: 0; width: 100%; height: 75px; background: rgba(0,0,0,0.95); display: flex; justify-content: space-around; align-items: center; z-index: 1000; border-top: 1px solid #1a1a1a; }
        .nav-os div { color: #333; font-size: 24px; transition: 0.3s; padding: 10px; }
        .nav-os .active { color: var(--accent); filter: drop-shadow(0 0 8px var(--accent)); }

        .btn-main { width: 100%; padding: 16px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="loader"><span>BYPASSING_SECURITY...</span></div>

    <div id="v-feed" class="view active">
        <div id="feed"></div>
    </div>

    <div id="v-profile" class="view" style="padding: 50px 20px; overflow-y: auto;">
        <div style="background:var(--surface); padding:30px; border-radius:25px; text-align:center; border:1px solid #222;">
            <div style="font-size:50px; color:var(--accent); margin-bottom:10px;"><i class="fa-solid fa-user-astronaut"></i></div>
            <h2 id="prof-user" style="text-transform: uppercase; margin-bottom: 5px;">CHARGEMENT...</h2>
            <div id="prof-rank-tag" class="rank-tag">RECRUE</div>
            
            <button class="btn-main" onclick="takeSnapshot()">
                <i class="fa-solid fa-share-nodes"></i> PARTAGER MON GRADE
            </button>
        </div>

        <h4 style="color:var(--accent); margin:30px 0 15px; font-size: 11px; letter-spacing:2px;">MISSIONS_DU_JOUR</h4>
        <div id="quest-list"></div>
        
        <button onclick="logout()" style="width:100%; margin-top:40px; background:none; border:1px solid #333; color:#444; padding:10px; border-radius:8px; font-size:10px;">DECONNEXION</button>
    </div>

    <div id="capture-zone">
        <div id="final-card" class="agent-card">
            <div style="color:var(--accent); font-size:9px; letter-spacing:4px; margin-bottom:20px;">KORELI_OS_VERIFIED</div>
            <div style="font-size:50px; margin-bottom:10px;">🛡️</div>
            <h2 id="card-name" style="color:white; text-transform:uppercase;">AGENT</h2>
            <div id="card-rank" class="rank-tag" style="margin: 15px 0;">RECRUE</div>
            <div id="card-xp" style="font-size:22px; font-weight:900; color:var(--accent); margin-top:20px;">0 XP</div>
        </div>
    </div>

    <nav class="nav-os">
        <div class="active" onclick="switchTab('v-feed', this)"><i class="fa-solid fa-play"></i></div>
        <div onclick="switchTab('v-profile', this)"><i class="fa-solid fa-user-ninja"></i></div>
    </nav>

    <script>
        const _URL = "https://ebykrodcycqcpcfuqpzi.supabase.co";
        const _KEY = "sb_publishable_j_DNfP9D_2K3uAzbb6-Giw_cWJJfR8_";
        const sup = supabase.createClient(_URL, _KEY);

        function getRank(xp) {
            if (xp >= 1000) return "COMMANDANT";
            if (xp >= 100) return "ÉLITE";
            if (xp >= 10) return "AGENT";
            return "RECRUE";
        }

        // --- 🚀 BOOT PRIORITAIRE ---
        async function boot() {
            // 1. On retire le loader très vite
            setTimeout(() => { document.getElementById('loader').style.opacity = '0'; setTimeout(()=>document.getElementById('loader').style.display='none', 500); }, 1500);

            try {
                const { data: posts } = await sup.from('posts').select('*').order('created_at', {ascending: false});
                if (posts && posts.length > 0) {
                    document.getElementById('feed').innerHTML = posts.map(p => `
                        <div class="unit">
                            <video loop playsinline muted src="${p.image_url}" onclick="this.muted=!this.muted; this.play();"></video>
                            <div class="v-hud">
                                <div class="rank-tag">${getRank(p.likes || 0)}</div>
                                <h3 style="margin-top:10px;">${p.content}</h3>
                            </div>
                        </div>
                    `).join('');
                    setupObserver();
                } else {
                    document.getElementById('feed').innerHTML = `<div style="padding:100px; text-align:center; color:#555;">AUCUNE DONNÉE DANS LE FLUX.</div>`;
                }
            } catch (e) { console.log("Silent error"); }
        }

        function setupObserver() {
            const obs = new IntersectionObserver(es => {
                es.forEach(e => {
                    const v = e.target.querySelector('video');
                    if(v) e.isIntersecting ? v.play().catch(()=>{}) : v.pause();
                });
            }, { threshold: 0.6 });
            document.querySelectorAll('.unit').forEach(u => obs.observe(u));
        }

        async function refreshProfile() {
            const { data: { user } } = await sup.auth.getUser();
            if(!user) { document.getElementById('prof-user').innerText = "AGENT_INCONNU"; return; }

            const { data: profs } = await sup.from('profiles').select('*').eq('id', user.id);
            const xp = (profs && profs[0]) ? profs[0].total_xp : 0;
            const rank = getRank(xp);
            const name = user.email.split('@')[0].toUpperCase();

            document.getElementById('prof-user').innerText = name;
            document.getElementById('prof-rank-tag').innerText = rank;
            document.getElementById('card-name').innerText = name;
            document.getElementById('card-rank').innerText = rank;
            document.getElementById('card-xp').innerText = xp + " XP";

            // Quêtes
            const { data: qs } = await sup.from('quests').select('*');
            if(qs) {
                document.getElementById('quest-list').innerHTML = qs.map(q => `
                    <div style="background:#151515; padding:15px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border:1px solid #222;" onclick="claim('${q.id}', ${q.xp_reward})">
                        <div>
                            <div style="font-size:13px; font-weight:bold;">${q.title}</div>
                            <div style="font-size:9px; color:var(--accent);">MISSION_DISPONIBLE</div>
                        </div>
                        <div style="color:var(--p); font-weight:900;">+${q.xp_reward}</div>
                    </div>
                `).join('');
            }
        }

        async function claim(qId, reward) {
            const { data: { user } } = await sup.auth.getUser();
            await sup.rpc('claim_quest_xp_secure', { u_id: user.id, q_id: qId, reward: reward });
            refreshProfile();
        }

        function takeSnapshot() {
            html2canvas(document.getElementById('final-card'), { backgroundColor: '#000', scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Koreli_Agent.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        function switchTab(id, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-os div').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            if(id === 'v-profile') refreshProfile();
        }

        async function logout() { await sup.auth.signOut(); location.reload(); }

        boot();
    </script>
</body>
</html>
