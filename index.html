<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empire OS v5.0 | AHMED-YASIN</title>
    <style>
        :root { --gold: #d4af37; --green: #00ff88; --red: #ff4444; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 0; }
        .header { background: #111; padding: 12px; border-bottom: 2px solid var(--gold); font-size: 0.7rem; display: flex; justify-content: space-around; font-weight: bold; }
        .rank-badge { color: var(--gold); font-weight: bold; text-transform: uppercase; letter-spacing: 3px; margin: 15px 0; font-size: 1.1rem; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
        .main-card { background: linear-gradient(145deg, #0a0a0a, #1a1a1a); border: 1px solid var(--gold); border-radius: 20px; padding: 25px; margin: 15px auto; max-width: 340px; text-align: left; position: relative; }
        .balance { font-size: 2.8rem; font-weight: bold; color: var(--gold); margin: 5px 0; }
        .performance { font-size: 0.9rem; font-weight: bold; margin-bottom: 15px; }
        .asset-row { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 8px 0; border-top: 1px solid #222; }
        .trade-panel { max-width: 340px; margin: auto; background: #111; padding: 20px; border-radius: 15px; border: 1px solid #222; }
        input { background: #000; border: 1px solid #333; color: var(--green); padding: 15px; width: 85%; border-radius: 10px; margin-bottom: 10px; font-size: 1.2rem; text-align: center; outline: none; }
        select { background: #000; color: white; padding: 10px; width: 95%; border-radius: 5px; margin-bottom: 15px; border: 1px solid #333; }
        .btn-buy { background: var(--green); color: black; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 48%; cursor: pointer; }
        .btn-sell { background: var(--red); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 48%; cursor: pointer; }
        .logs { max-width: 340px; margin: 15px auto; text-align: left; font-family: monospace; font-size: 0.65rem; color: #555; height: 70px; overflow-y: auto; padding: 10px; background: #080808; border-radius: 5px; }
    </style>
</head>
<body onload="init()">

    <div class="header">
        <span id="btc-ticker">BTC: $--</span>
        <span id="eth-ticker">ETH: $--</span>
        <span style="color:var(--green)">SYSTÈME ACTIF</span>
    </div>

    <div class="rank-badge" id="rank-name">CHARGEMENT...</div>

    <div class="main-card">
        <div style="font-size: 0.7rem; opacity: 0.5;">VALEUR TOTALE ESTIMÉE</div>
        <div class="balance">$ <span id="total-val">10,000</span></div>
        <div id="perf-pct" class="performance">ROI: +0.00%</div>
        
        <div class="asset-row"><span>CASH DISPONIBLE:</span> <span id="cash">$10,000</span></div>
        <div class="asset-row"><span>BITCOIN (BTC):</span> <span id="btc-qty">0.000000</span></div>
        <div class="asset-row"><span>ETHEREUM (ETH):</span> <span id="eth-qty">0.000000</span></div>
    </div>

    <div class="trade-panel">
        <select id="asset-choice">
            <option value="BTC">BITCOIN (BTC)</option>
            <option value="ETH">ETHEREUM (ETH)</option>
        </select>
        <input type="number" id="trade-input" placeholder="MONTANT EN $">
        <div style="display:flex; justify-content: space-between;">
            <button class="btn-buy" onclick="trade('buy')">ACHETER</button>
            <button class="btn-sell" onclick="trade('sell')">VENDRE TOUT</button>
        </div>
    </div>

    <div class="logs" id="history">> TERMINAL SÉCURISÉ PRÊT.</div>

    <script>
        let cash = 10000;
        let assets = { BTC: 0, ETH: 0 };
        let prices = { BTC: 0, ETH: 0 };

        async function updatePrices() {
            try {
                const r = await fetch('https://api.binance.com/api/v3/ticker/price?symbols=["BTCUSDT","ETHUSDT"]');
                const data = await r.json();
                prices.BTC = parseFloat(data.find(i => i.symbol === "BTCUSDT").price);
                prices.ETH = parseFloat(data.find(i => i.symbol === "ETHUSDT").price);
                
                document.getElementById('btc-ticker').innerText = `BTC: $${prices.BTC.toLocaleString()}`;
                document.getElementById('eth-ticker').innerText = `ETH: $${prices.ETH.toLocaleString()}`;
                refreshUI();
            } catch(e) { console.log("Market Error"); }
        }

        function trade(type) {
            const asset = document.getElementById('asset-choice').value;
            const val = parseFloat(document.getElementById('trade-input').value);
            if(prices[asset] <= 0 || isNaN(val) || val <= 0) return;

            if(type === 'buy') {
                if(val <= cash) {
                    cash -= val;
                    assets[asset] += val / prices[asset];
                    log(`ACHAT ${asset}: -$${val}`);
                } else { alert("Fonds insuffisants"); }
            } else {
                if(assets[asset] > 0) {
                    let gain = assets[asset] * prices[asset];
                    cash += gain;
                    log(`VENTE ${asset}: +$${gain.toFixed(2)}`);
                    assets[asset] = 0;
                } else { alert(`Aucun ${asset} à vendre`); }
            }
            save();
            refreshUI();
            document.getElementById('trade-input').value = "";
        }

        function refreshUI() {
            let total = cash + (assets.BTC * prices.BTC) + (assets.ETH * prices.ETH);
            document.getElementById('total-val').innerText = Math.floor(total).toLocaleString();
            document.getElementById('cash').innerText = `$${Math.floor(cash).toLocaleString()}`;
            document.getElementById('btc-qty').innerText = assets.BTC.toFixed(6);
            document.getElementById('eth-qty').innerText = assets.ETH.toFixed(6);

            let perf = ((total - 10000) / 10000) * 100;
            const pEl = document.getElementById('perf-pct');
            pEl.innerText = `ROI: ${perf >= 0 ? '+' : ''}${perf.toFixed(2)}%`;
            pEl.style.color = perf >= 0 ? 'var(--green)' : 'var(--red)';

            let rank = "TRADER NOVICE";
            if(total > 20000) rank = "SHARK FINANCIER";
            if(total > 100000) rank = "EMPIRE CEO";
            if(total > 1000000) rank = "LEGENDARY GOJO";
            document.getElementById('rank-name').innerText = rank;
        }

        function log(m) {
            const h = document.getElementById('history');
            h.innerHTML = `<div>> ${new Date().toLocaleTimeString()} | ${m}</div>` + h.innerHTML;
        }

        function save() {
            localStorage.setItem('emp_v5_data', JSON.stringify({cash, assets}));
        }

        function init() {
            const saved = JSON.parse(localStorage.getItem('emp_v5_data'));
            if(saved) { cash = saved.cash; assets = saved.assets; }
            updatePrices();
            setInterval(updatePrices, 5000);
        }
    </script>
</body>
</html>
