<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empire Vision | AHMED-YASIN</title>
    <style>
        :root { --gold: #d4af37; --green: #00ff88; --red: #ff4444; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 400px; margin: auto; }
        .card { background: #111; border: 1px solid var(--gold); border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .balance { font-size: 2.2rem; font-weight: bold; color: var(--gold); }
        .section-title { font-size: 0.75rem; text-transform: uppercase; color: var(--gold); letter-spacing: 1.5px; margin-bottom: 12px; display: block; font-weight: bold; }
        
        /* Barre de progression */
        .goal-container { margin-top: 15px; background: #222; border-radius: 10px; height: 20px; overflow: hidden; border: 1px solid #333; }
        .goal-bar { background: linear-gradient(90deg, var(--gold), #f3cf65); height: 100%; width: 0%; transition: width 0.5s ease; }
        
        .input-group { background: #161616; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #222; }
        input { background: #000; border: 1px solid #333; color: white; padding: 12px; width: 90%; border-radius: 8px; margin-bottom: 10px; outline: none; }
        button { background: var(--gold); color: black; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        
        .history { font-size: 0.85rem; max-height: 180px; overflow-y: auto; }
        .log-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
    </style>
</head>
<body onload="init()">

<div class="container">
    <div style="text-align:center; margin-bottom: 25px;">
        <h2 style="color:var(--gold); margin:0; letter-spacing: 2px;">EMPIRE VISION</h2>
        <span style="font-size:0.7rem; opacity:0.5; text-transform: uppercase;">Stratégie Réelle par AHMED-YASIN</span>
    </div>

    <div class="card">
        <span class="section-title">Objectif : <span id="goal-name-display">Nouveau PC</span></span>
        <div style="display:flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px;">
            <span id="current-total">0.00 €</span>
            <span style="opacity:0.6">Cible: <span id="goal-price-display">1200</span> €</span>
        </div>
        <div class="goal-container">
            <div class="goal-bar" id="goal-progress"></div>
        </div>
        <div id="percentage" style="text-align:right; font-size: 0.7rem; margin-top: 5px; color: var(--gold);">0%</div>
    </div>

    <div class="input-group">
        <span class="section-title">Configurer l'Objectif</span>
        <input type="text" id="goal-name" placeholder="Nom de l'objectif (ex: PS5)">
        <input type="number" id="goal-price" placeholder="Prix cible (€)">
        <button onclick="updateGoal()">METTRE À JOUR L'OBJECTIF</button>
    </div>

    <div class="input-group">
        <span class="section-title">Ajouter du Cash Réel</span>
        <input type="number" id="amount" placeholder="Montant (€)">
        <button style="background: var(--green);" onclick="addCash()">+ AJOUTER AUX ÉCONOMIES</button>
    </div>

    <div class="card">
        <span class="section-title">Journal des Flux</span>
        <div class="history" id="history-list"></div>
    </div>
</div>

<script>
    let currentCash = 0;
    let goalPrice = 1200;
    let goalName = "Nouveau PC";
    let logs = [];

    function updateGoal() {
        const name = document.getElementById('goal-name').value;
        const price = parseFloat(document.getElementById('goal-price').value);
        if(name) goalName = name;
        if(!isNaN(price) && price > 0) goalPrice = price;
        save();
        render();
    }

    function addCash() {
        const amount = parseFloat(document.getElementById('amount').value);
        if(isNaN(amount) || amount <= 0) return;
        currentCash += amount;
        logs.push({ amount, date: new Date().toLocaleDateString() });
        save();
        render();
        document.getElementById('amount').value = '';
    }

    function render() {
        document.getElementById('goal-name-display').innerText = goalName;
        document.getElementById('goal-price-display').innerText = goalPrice.toLocaleString();
        document.getElementById('current-total').innerText = currentCash.toFixed(2) + ' €';
        
        let pct = (currentCash / goalPrice) * 100;
        if(pct > 100) pct = 100;
        document.getElementById('goal-progress').style.width = pct + '%';
        document.getElementById('percentage').innerText = Math.floor(pct) + '% COMPLÉTÉ';

        document.getElementById('history-list').innerHTML = logs.map(l => `
            <div class="log-item">
                <span>Économie <br><small style="opacity:0.5">${l.date}</small></span>
                <span style="color:var(--green)">+${l.amount.toFixed(2)} €</span>
            </div>
        `).reverse().join('');
    }

    function save() {
        localStorage.setItem('vision_cash', currentCash);
        localStorage.setItem('vision_goal_price', goalPrice);
        localStorage.setItem('vision_goal_name', goalName);
        localStorage.setItem('vision_logs', JSON.stringify(logs));
    }

    function init() {
        const sCash = localStorage.getItem('vision_cash');
        const sPrice = localStorage.getItem('vision_goal_price');
        const sName = localStorage.getItem('vision_goal_name');
        const sLogs = localStorage.getItem('vision_logs');
        if(sCash) currentCash = parseFloat(sCash);
        if(sPrice) goalPrice = parseFloat(sPrice);
        if(sName) goalName = sName;
        if(sLogs) logs = JSON.parse(sLogs);
        render();
    }
</script>

</body>
</html>
