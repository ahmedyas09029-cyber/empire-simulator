<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KORELI | EMPIRE EDITION</title>
    <style>
        :root { --accent: #a855f7; --bg: #050505; --card: #121212; --text: #f0f0f0; --coin: #FFD700; --red: #ef4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Header */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a1a; background: rgba(5,5,5,0.9); backdrop-filter: blur(10px); z-index: 100; }
        .logo { font-weight: 900; font-size: 1.5rem; letter-spacing: 2px; background: linear-gradient(90deg, #fff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .coin-pill { background: rgba(255, 215, 0, 0.1); border: 1px solid var(--coin); padding: 5px 12px; border-radius: 20px; color: var(--coin); font-weight: bold; font-size: 0.8rem; }

        .content { flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .page { display: none; padding: 15px; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Studio d'Upload */
        .studio-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #222; margin-bottom: 25px; }
        textarea { width: 100%; background: transparent; border: none; color: white; font-size: 1rem; outline: none; resize: none; margin-bottom: 15px; }
        .upload-zone { background: #0a0a0a; border: 2px dashed #333; border-radius: 15px; padding: 30px 10px; text-align: center; cursor: pointer; color: #666; transition: 0.3s; }
        .upload-zone:hover { border-color: var(--accent); color: var(--accent); }
        .btn-pub { background: var(--accent); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; margin-top: 15px; cursor: pointer; }

        /* Feed */
        .post { background: var(--card); border-radius: 20px; margin-bottom: 20px; border: 1px solid #1a1a1a; overflow: hidden; }
        .post-user { padding: 12px 15px; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .badge { color: var(--accent); font-size: 0.7rem; }
        video { width: 100%; max-height: 450px; background: #000; }
        .post-cap { padding: 12px 15px; font-size: 0.9rem; color: #ccc; }

        /* Messagerie Directe */
        .chat-header { padding-bottom: 15px; border-bottom: 1px solid #222; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; }
        .msg-box { height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 15px; font-size: 0.85rem; }
        .msg.me { align-self: flex-end; background: var(--accent); }
        .msg.them { align-self: flex-start; background: #222; }
        .chat-input { display: flex; gap: 10px; margin-top: 15px; }
        .chat-input input { flex: 1; background: #1a1a1a; border: 1px solid #333; padding: 10px; border-radius: 10px; color: white; outline: none; }

        /* Boutique */
        .pack { background: #111; border: 1px solid var(--coin); border-radius: 15px; padding: 20px; text-align: center; margin-bottom: 15px; }

        /* Navbar avec Notif */
        .nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 60px; background: rgba(18,18,18,0.95); border-radius: 25px; border: 1px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { color: #555; font-size: 1.3rem; cursor: pointer; position: relative; }
        .nav-item.active { color: var(--accent); }
        .notif-dot { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background: var(--red); border-radius: 50%; display: block; border: 2px solid #121212; }
    </style>
</head>
<body onload="init()">

    <div class="header">
        <div class="logo">KORELI</div>
        <div class="coin-pill">💎 <span id="coins">0</span></div>
    </div>

    <div class="content">
        <div id="p-home" class="page active">
            <div class="studio-card">
                <textarea id="cap-in" placeholder="Une nouvelle vidéo pour tes fans ?"></textarea>
                <div class="upload-zone" onclick="document.getElementById('file-in').click()" id="up-zone">
                    <span>🎥 CLIQUE POUR AJOUTER UNE VIDÉO</span>
                    <input type="file" id="file-in" accept="video/*" style="display:none" onchange="handleVid()">
                </div>
                <button class="btn-pub" onclick="pub()">PUBLIER</button>
            </div>
            <div id="feed"></div>
        </div>

        <div id="p-chat" class="page">
            <div class="chat-header">
                <div style="font-weight:bold">YouTubeur_Pro <span class="badge">✅</span></div>
                <div class="dot"></div>
            </div>
            <div class="msg-box" id="msg-box">
                <div class="msg them">Salut Ahmed-Yasin ! Prêt pour le lancement ?</div>
            </div>
            <div class="chat-input">
                <input type="text" id="chat-in" placeholder="Ton message...">
                <button onclick="sendMsg()" style="background:none; border:none; color:var(--accent); font-weight:bold;">ENVOYER</button>
            </div>
        </div>

        <div id="p-shop" class="page">
            <h3 style="color:var(--coin)">BOUTIQUE K-COINS</h3>
            <div class="pack">
                <h4>Pack Empire</h4>
                <p>50 000 K-Coins</p>
                <button onclick="buy(50000)" style="background:var(--coin); border:none; padding:10px; border-radius:8px; font-weight:bold;">SIMULER L'ACHAT</button>
            </div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="go('home', this)">🏠</div>
        <div class="nav-item" onclick="go('chat', this)">💬<span class="notif-dot" id="notif"></span></div>
        <div class="nav-item" onclick="go('shop', this)">🛒</div>
        <div class="nav-item" onclick="go('profile', this)">👤</div>
    </div>

    <script>
        let videoBase64 = null;
        let userCoins = 0;

        function handleVid() {
            const file = document.getElementById('file-in').files[0];
            if(file) {
                document.getElementById('up-zone').innerText = "✅ VIDÉO CHARGÉE";
                const reader = new FileReader();
                reader.onload = (e) => { videoBase64 = e.target.result; };
                reader.readAsDataURL(file);
            }
        }

        function pub() {
            const txt = document.getElementById('cap-in').value;
            if(!videoBase64 && !txt) return;
            const post = `
                <div class="post">
                    <div class="post-user">👤 Ahmed-Yasin <span class="badge">CEO</span></div>
                    ${videoBase64 ? `<video controls src="${videoBase64}"></video>` : ''}
                    <div class="post-cap">${txt}</div>
                </div>
            `;
            document.getElementById('feed').insertAdjacentHTML('afterbegin', post);
            document.getElementById('cap-in').value = "";
            document.getElementById('up-zone').innerText = "🎥 CLIQUE POUR AJOUTER UNE VIDÉO";
            videoBase64 = null;
        }

        function sendMsg() {
            const inpt = document.getElementById('chat-in');
            if(!inpt.value) return;
            document.getElementById('msg-box').insertAdjacentHTML('beforeend', `<div class="msg me">${inpt.value}</div>`);
            inpt.value = "";
        }

        function buy(amt) {
            userCoins += amt;
            localStorage.setItem('k_coins', userCoins);
            document.getElementById('coins').innerText = userCoins;
            alert("Compte crédité !");
        }

        function go(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('p-' + id).classList.add('active');
            el.classList.add('active');
            if(id === 'chat') document.getElementById('notif').style.display = 'none';
        }

        function init() {
            userCoins = parseInt(localStorage.getItem('k_coins') || '0');
            document.getElementById('coins').innerText = userCoins;
        }
    </script>
</body>
</html>
