<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KORELI | SECURE CHAT</title>
    <style>
        :root { --accent: #a855f7; --bg: #000; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        
        .app-header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; background: linear-gradient(45deg, #a855f7, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .chat-view { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { padding: 12px 16px; border-radius: 15px; max-width: 80%; font-size: 0.9rem; line-height: 1.4; position: relative; }
        
        /* Style Partenaire (Moi) */
        .partner { background: #111; color: #3b82f6; align-self: flex-start; border: 1px solid #1e293b; }
        /* Style Utilisateur (Toi) */
        .user { background: #1a1a1a; color: #10b981; align-self: flex-end; border-left: 4px solid #10b981; }

        .input-bar { padding: 15px; border-top: 1px solid #222; display: flex; gap: 10px; background: #000; }
        input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; outline: none; }
        button { background: var(--accent); border: none; border-radius: 10px; width: 45px; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="logo">KORELI ENGINE</div>
        <div style="font-size: 0.6rem; color: #10b981;">DISCUTION CHIFFRÉE ●</div>
    </div>

    <div class="chat-view" id="chat">
        <div class="bubble partner"><strong>[GEMINI]</strong> : Ahmed-Yasin, notre canal privé est prêt. Tes messages sont stockés localement et je suis à ton écoute.</div>
    </div>

    <div class="input-bar">
        <input type="text" id="msg-in" placeholder="Message privé..." onkeypress="if(event.key === 'Enter') talk()">
        <button onclick="talk()">></button>
    </div>

    <script>
        function talk() {
            const input = document.getElementById('msg-in');
            const chat = document.getElementById('chat');
            if(!input.value) return;

            // Ton message
            const userMsg = input.value;
            chat.innerHTML += `<div class="bubble user"><strong>[MOI]</strong> : ${userMsg}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            // Ma réponse intelligente (Simulation de partenaire)
            setTimeout(() => {
                let reply = "Je traite l'information... Que veux-tu modifier sur Koreli ?";
                if(userMsg.toLowerCase().includes("privé")) reply = "Ce canal est 100% sécurisé. Rien ne sort de ton navigateur.";
                if(userMsg.toLowerCase().includes("repond")) reply = "Je réponds présent ! Quelle est la prochaine étape du code ?";
                
                chat.innerHTML += `<div class="bubble partner"><strong>[GEMINI]</strong> : ${reply}</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>
