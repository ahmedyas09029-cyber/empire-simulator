<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KORELI | FINANCIAL EMPIRE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --accent: #a855f7; 
            --bg: #050505; 
            --card: #121212; 
            --text: #f0f0f0; 
            --coin: #FFD700; 
            --euro: #00ff88;
            --founder: linear-gradient(135deg, #FFD700, #ff8800);
            --glass: rgba(255, 255, 255, 0.03);
        }
        
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(5,5,5,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 1.4rem; letter-spacing: -1px; background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; scrollbar-width: none; }
        .content::-webkit-scrollbar { display: none; }

        .card { background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid #222; margin-bottom: 20px; position: relative; overflow: hidden; }
        .card::after { content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100px; background: var(--accent); filter: blur(80px); opacity: 0.1; }

        /* STATS COMPTE */
        .balance-label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .balance-val { font-size: 2.2rem; font-weight: 800; margin: 5px 0; color: var(--coin); }
        .euro-val { font-size: 1.1rem; color: var(--euro); font-weight: 600; }

        /* CEO PANEL */
        .ceo-card { background: linear-gradient(145deg, #1a1a1a, #0a0a0a); border: 1px solid #333; }
        .badge-founder { display: inline-block; padding: 6px 15px; border-radius: 50px; background: var(--founder); color: black; font-weight: 900; font-size: 0.7rem; margin-top: 10px; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3); }

        /* INPUTS & BTNS */
        input { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 15px; border-radius: 16px; margin: 8px 0; font-size: 1rem; transition: 0.3s; box-sizing: border-box; }
        input:focus { border-color: var(--accent); outline: none; background: #080808; }
        .btn-main { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-auth { background: white; color: black; }
        .btn-gift { background: var(--founder); color: black; margin-top: 10px; }

        /* NAVIGATION */
        .nav { position: fixed; bottom: 0; width: 100%; background: rgba(10,10,10,0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
        .nav-btn { color: #555; font-size: 0.75rem; font-weight: 600; text-align: center; cursor: pointer; transition: 0.3s; }
        .nav-btn.active { color: var(--accent); }
    </style>
</head>
<body onload="init()">

    <div class="header">
        <div class="logo">KORELI</div>
        <div id="euro-total" style="color:var(--euro); font-weight:bold; font-size:0.9rem;">0.00 €</div>
    </div>

    <div id="auth-screen" style="display:none; padding:80px 30px; text-align:center;">
        <div style="font-size: 4rem;">🗝️</div>
        <h1 style="margin: 10px 0;">Accès Cloud</h1>
        <p style="color:#666; margin-bottom:40px;">Entrez votre email citoyen pour recevoir votre clé d'accès.</p>
        <input type="email" id="email-input" placeholder="nom@exemple.com">
        <button class="btn-main btn-auth" onclick="loginWithEmail()">RECEVOIR LE LIEN</button>
    </div>

    <div id="main-app" style="display:none;" class="content">
        
        <div id="tab-wallet">
            <div class="card" style="text-align:center;">
                <div class="balance-label">Solde K-Coins</div>
                <div class="balance-val" id="user-coins">0</div>
                <div class="euro-val" id="user-euros">≈ 0.00 €</div>
                <div id="user-badge"></div>
            </div>

            <div id="ceo-panel" style="display:none;" class="card ceo-card">
                <h3 style="margin-top:0; color:var(--coin);">🏦 BANQUE CENTRALE</h3>
                <p style="font-size:0.8rem; color:#888;">Générez et distribuez de la valeur dans l'empire.</p>
                <input type="text" id="target" placeholder="ID du citoyen">
                <input type="number" id="amt" placeholder="Montant 💎">
                <button class="btn-main btn-gift" onclick="processGift()">VALIDER LE TRANSFERT</button>
            </div>

            <div class="card" style="border: 1px dashed #333; text-align:center;">
                <p style="font-size:0.8rem; color:#44ff44; margin:0;">STABILITÉ RÉSEAU : 99.9% ✅</p>
                <button onclick="logout()" style="background:none; border:none; color:#ff4444; margin-top:15px; font-weight:bold; cursor:pointer;">Déconnexion sécurisée</button>
            </div>
        </div>

        <div id="tab-shop" style="display:none;">
            <div class="card">
                <h3 style="margin-top:0;">🛒 MARKETPLACE</h3>
                <div style="display:flex; justify-content:space-between; padding:15px 0; border-bottom:1px solid #222;">
                    <span>Pass Fondateur</span>
                    <span style="color:var(--coin); font-weight:bold;">5000 💎</span>
                </div>
                <div style="display:flex; justify-content:space-between; padding:15px 0;">
                    <span>Pseudo Coloré</span>
                    <span style="color:var(--coin); font-weight:bold;">1200 💎</span>
                </div>
            </div>
        </div>

    </div>

    <nav class="nav" id="nav-bar" style="display:none;">
        <div class="nav-btn active" onclick="switchTab('wallet')">💰 WALLET</div>
        <div class="nav-btn" onclick="switchTab('shop')">🛒 SHOP</div>
        <div class="nav-btn" onclick="alert('Koreli Social arrive bientôt !')">📱 SOCIAL</div>
    </nav>

    <script>
        // CONFIGURATION OFFICIELLE
        const PROJECT_URL = "https://ebykrodcycqcpcfuqpzi.supabase.co";
        const PUBLIC_KEY = "sb_publishable_j_DNfP9D_2K3uAzbb6-Giw_cWJJfR8_";
        const REDIRECT_URL = "https://empire-simulator-ahmedyas09029-cybers-projects.vercel.app/"; 
        const K_COIN_RATE = 0.05; // 1 K-Coin = 0.05€ (Tu peux changer ce taux !)

        const sb = supabase.createClient(PROJECT_URL, PUBLIC_KEY);

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) { showApp(session.user); } 
            else { document.getElementById('auth-screen').style.display = 'block'; }
        }

        async function loginWithEmail() {
            const email = document.getElementById('email-input').value;
            if(!email) return alert("Email requis !");
            const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: REDIRECT_URL } });
            if(error) alert(error.message); else alert("Lien magique envoyé !");
        }

        function showApp(user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('nav-bar').style.display = 'flex';

            const isCEO = (user.email === "ahmedyas09029@gmail.com"); //
            
            // Calcul de la valeur
            let coins = isCEO ? 1000000 : 0; // On affiche un million pour le fun si CEO
            let euros = (coins * K_COIN_RATE).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });

            document.getElementById('user-coins').innerText = isCEO ? "ILLIMITÉ" : "0";
            document.getElementById('user-euros').innerText = isCEO ? "VALEUR : INCALCULABLE" : `≈ 0,00 €`;
            document.getElementById('euro-total').innerText = isCEO ? "👑 CEO MODE" : "0,00 €";

            if(isCEO) {
                document.getElementById('user-badge').innerHTML = '<div class="badge-founder">👑 GRAND FOUNDER</div>';
                document.getElementById('ceo-panel').style.display = 'block';
            }
        }

        function switchTab(tab) {
            document.getElementById('tab-wallet').style.display = tab === 'wallet' ? 'block' : 'none';
            document.getElementById('tab-shop').style.display = tab === 'shop' ? 'block' : 'none';
            document.querySelectorAll('.nav-btn').forEach((b, i) => {
                b.classList.remove('active');
                if((tab==='wallet' && i===0) || (tab==='shop' && i===1)) b.classList.add('active');
            });
        }

        function processGift() {
            const target = document.getElementById('target').value;
            const amount = document.getElementById('amt').value;
            if(target && amount) {
                alert(`💸 TRANSFERT RÉUSSI : ${amount} K-Coins envoyés à ${target}.\nValeur estimée : ${(amount * K_COIN_RATE).toFixed(2)} €`);
            }
        }

        async function logout() { await sb.auth.signOut(); location.reload(); }
    </script>
</body>
</html>
